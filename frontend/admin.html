<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | HackBox</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' },
                        primary: { 400: '#22d3ee', 500: '#06b6d4' },
                        accent: { 400: '#a78bfa', 500: '#8b5cf6' },
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; overflow-x: hidden; }
        .hover-spring { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-spring:hover { transform: scale(1.02) translateY(-2px); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: slideUp 0.6s ease-out forwards; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-pending { background-color: #facc15; box-shadow: 0 0 10px #facc15aa; }
        .status-approved { background-color: #4ade80; box-shadow: 0 0 10px #4ade80aa; }
        .status-rejected { background-color: #f87171; box-shadow: 0 0 10px #f87171aa; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-64 bg-slate-900/80 backdrop-blur-md md:h-screen fixed md:sticky top-0 z-50 flex flex-col justify-between border-r border-slate-800/50">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-400 to-accent-500 flex items-center justify-center shadow-lg shadow-primary-500/20">
                    <i class="fa-solid fa-bolt text-white text-xl"></i>
                </div>
                <h1 class="font-display font-bold text-2xl tracking-tight text-white">Hack<span class="text-primary-400">Box</span></h1>
            </div>

            <nav class="px-4 space-y-2 mt-4">
                <a href="admin.html" class="flex items-center gap-3 px-4 py-3 bg-primary-500/10 text-primary-400 border border-primary-500/20 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-shield-halved w-5"></i> Admin Center
                </a>
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-house w-5"></i> User View
                </a>
            </nav>
        </div>

        <div class="p-6 border-t border-slate-800/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center ring-2 ring-primary-500/30 font-bold text-white">AD</div>
                <div>
                    <p class="text-sm font-semibold text-white">Administrator</p>
                    <p class="text-xs text-slate-500">Super User</p>
                </div>
                <button onclick="logout()" class="ml-auto text-slate-500 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 relative">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10 animate-entry">
            <div>
                <h2 class="font-display text-3xl font-bold text-white mb-1">Command Center</h2>
                <p class="text-slate-400">Manage all employee feedback from one place.</p>
            </div>
            <button onclick="fetchSuggestions()" class="glass-panel hover-spring px-5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 animate-entry">
            <div class="glass-panel p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Pending Review</p>
                <h3 class="text-4xl font-display font-bold text-white" id="stat-pending">--</h3>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Total Approved</p>
                <h3 class="text-4xl font-display font-bold text-emerald-400" id="stat-approved">--</h3>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Approval Rate</p>
                <h3 class="text-4xl font-display font-bold text-accent-400" id="stat-rate">--%</h3>
            </div>
        </section>

        <section class="glass-panel rounded-2xl overflow-hidden animate-entry">
            <div class="p-6 border-b border-slate-800/50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Global Suggestion Feed</h3>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search..." class="bg-slate-900/50 border border-slate-700 text-slate-300 text-sm rounded-xl px-4 py-2 w-64">
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-400">
                    <thead class="bg-slate-900/40 text-xs uppercase font-semibold text-slate-300">
                        <tr>
                            <th class="px-6 py-4">User</th>
                            <th class="px-6 py-4">Summary</th>
                            <th class="px-6 py-4">Category</th>
                            <th class="px-6 py-4">Sentiment</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="suggestions-table-body" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // --- LOGIC START ---
        const API_BASE_URL = "http://localhost:8000"; 
        let globalData = [];

        // 1. Auth Check
        if (!localStorage.getItem('token')) window.location.href = 'index.html';

        // 2. Fetch Data (GLOBAL)
        async function fetchSuggestions() {
            try {
                // NOTE: No ?username= param here. We want EVERYTHING.
                const response = await fetch(`${API_BASE_URL}/suggestions`);
                if (!response.ok) throw new Error("API Error");
                globalData = await response.json();
                
                renderTable(globalData);
                calculateStats(globalData);
            } catch (error) {
                console.error(error);
                alert("Error connecting to backend.");
            }
        }

        // 3. Render Table
        function renderTable(data) {
            const tbody = document.getElementById('suggestions-table-body');
            tbody.innerHTML = '';

            data.forEach((item, index) => {
                const sentimentColor = item.sentiment > 75 ? 'bg-green-500' : item.sentiment > 40 ? 'bg-yellow-500' : 'bg-red-500';
                
                // Status Badge Logic
                let statusBadge = '';
                if(item.status === 'approved') statusBadge = `<span class="px-2 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20"><span class="status-dot status-approved"></span>Approved</span>`;
                else if(item.status === 'rejected') statusBadge = `<span class="px-2 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20"><span class="status-dot status-rejected"></span>Rejected</span>`;
                else statusBadge = `<span class="px-2 py-1 rounded-full text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20"><span class="status-dot status-pending"></span>Pending</span>`;

                // Action Buttons Logic
                let actionBtns = '';
                if(item.status === 'pending') {
                    actionBtns = `
                        <button onclick="updateStatus('${item.id}', 'approved')" class="text-slate-400 hover:text-green-400 mx-1 p-2 rounded-full hover:bg-green-400/10"><i class="fa-solid fa-check"></i></button>
                        <button onclick="updateStatus('${item.id}', 'rejected')" class="text-slate-400 hover:text-red-400 mx-1 p-2 rounded-full hover:bg-red-400/10"><i class="fa-solid fa-xmark"></i></button>
                    `;
                } else {
                    actionBtns = `<span class="text-xs text-slate-600 italic">Decided</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors animate-entry";
                tr.style.animationDelay = `${index * 0.05}s`;
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-white">${item.username || 'Anon'}</td>
                    <td class="px-6 py-4 truncate max-w-xs" title="${item.text}">${item.ai_summary || item.text}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded-md bg-slate-800 text-xs border border-slate-700">${item.category}</span></td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div class="${sentimentColor} h-full" style="width: ${item.sentiment}%"></div>
                            </div>
                            <span class="text-xs">${item.sentiment}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4 text-right">${actionBtns}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. Update Status (PATCH)
        async function updateStatus(id, newStatus) {
            try {
                const response = await fetch(`${API_BASE_URL}/suggestions/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    // Refresh data to show new status
                    fetchSuggestions();
                } else {
                    alert("Failed to update status");
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 5. Dynamic Stats Calculation
        function calculateStats(items) {
            const total = items.length;
            const pending = items.filter(i => i.status === 'pending').length;
            const approved = items.filter(i => i.status === 'approved').length;
            const rejected = items.filter(i => i.status === 'rejected').length;
            
            const totalDecided = approved + rejected;
            const rate = totalDecided > 0 ? Math.round((approved / totalDecided) * 100) : 0;

            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-approved').innerText = approved;
            document.getElementById('stat-rate').innerText = rate + "%";
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalData.filter(item => 
                (item.username && item.username.toLowerCase().includes(term)) || 
                (item.text && item.text.toLowerCase().includes(term))
            );
            renderTable(filtered);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Init
        window.addEventListener('DOMContentLoaded', fetchSuggestions);
    </script>
</body>
</html>
