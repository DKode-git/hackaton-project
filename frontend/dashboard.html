<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | AI Insight Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        zinc: {
                            950: '#09090b', // Background
                            900: '#18181b', // Surface
                            850: '#27272a', // Border
                        },
                        ai: {
                            glow: '#d946ef', // Fuchsia-500
                            dim: '#86198f',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* 1. THE SPRING RULE */
        .hover-spring {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .hover-spring:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(217, 70, 239, 0.2);
        }
        .hover-spring:active {
            transform: scale(0.95);
        }

        /* 2. THE ENTRY RULE */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: slideUp 0.6s ease-out forwards;
        }
        .animate-entry-delay-1 { animation-delay: 0.1s; }
        .animate-entry-delay-2 { animation-delay: 0.2s; }

        /* SCROLLBAR HIDING */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* TOOLTIP LOGIC */
        .tooltip-trigger:hover .tooltip-content {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans h-screen flex overflow-hidden selection:bg-ai-glow selection:text-white">

    <nav class="w-16 border-r border-zinc-800 bg-zinc-900/50 backdrop-blur-xl flex flex-col items-center py-6 z-20">
        <div class="mb-8 text-ai-glow text-2xl">
            <i class="fa-solid fa-bolt"></i>
        </div>
        
        <div class="flex flex-col gap-6 w-full items-center">
            <button class="w-10 h-10 rounded-xl bg-zinc-800 text-white shadow-lg shadow-ai-glow/20 border border-ai-glow/30 flex items-center justify-center hover-spring">
                <i class="fa-solid fa-chart-pie text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-xl text-zinc-500 hover:text-white hover:bg-zinc-800 transition-all flex items-center justify-center">
                <i class="fa-solid fa-inbox text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-xl text-zinc-500 hover:text-white hover:bg-zinc-800 transition-all flex items-center justify-center">
                <i class="fa-solid fa-users text-sm"></i>
            </button>
        </div>

        <div class="mt-auto">
            <button onclick="handleLogout()" class="w-10 h-10 rounded-xl text-zinc-500 hover:text-red-400 hover:bg-red-900/10 transition-all flex items-center justify-center">
                <i class="fa-solid fa-power-off text-sm"></i>
            </button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900/30 backdrop-blur-sm z-10">
            <div class="flex items-center gap-3">
                <h1 class="font-display font-bold text-white text-lg tracking-tight">Admin<span class="text-ai-glow">Console</span></h1>
                <span class="px-2 py-0.5 rounded-full bg-zinc-800 border border-zinc-700 text-[10px] text-zinc-400 font-mono">v2.4.0</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-xs text-zinc-400 font-mono">System Online</span>
                </div>
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-ai-dim to-ai-glow p-[1px]">
                    <div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center text-xs text-white font-bold">JD</div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar relative">
            
            <section id="ai-header" class="w-full h-48 rounded-2xl relative overflow-hidden border border-zinc-800 shadow-2xl animate-entry opacity-0">
                <div class="absolute inset-0 bg-gradient-to-r from-zinc-900 via-zinc-900 to-fuchsia-950/40"></div>
                <div class="absolute top-0 right-0 w-96 h-96 bg-ai-glow/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4 animate-pulse-slow"></div>
                
                <div class="relative z-10 h-full flex flex-col justify-between p-6">
                    <div>
                        <div class="flex items-center gap-2 text-ai-glow mb-1">
                            <i class="fa-solid fa-sparkles"></i>
                            <span class="text-xs font-bold tracking-widest uppercase">AI Real-time Analysis</span>
                        </div>
                        <h2 class="text-3xl font-display font-bold text-white max-w-lg leading-tight">
                            Workforce sentiment is <span id="header-sentiment-text" class="text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400">analyzing...</span>
                        </h2>
                    </div>

                    <div class="grid grid-cols-4 gap-4 border-t border-white/5 pt-4">
                        <div>
                            <p class="text-zinc-500 text-xs uppercase font-semibold">Avg Sentiment</p>
                            <p id="stat-score" class="text-2xl font-mono text-white">--%</p>
                        </div>
                        <div>
                            <p class="text-zinc-500 text-xs uppercase font-semibold">Top Topic</p>
                            <p id="stat-topic" class="text-lg font-display text-white">--</p>
                        </div>
                        <div>
                            <p class="text-zinc-500 text-xs uppercase font-semibold">Urgent Flags</p>
                            <p id="stat-urgent" class="text-lg font-display text-red-400">--</p>
                        </div>
                        <div>
                            <p class="text-zinc-500 text-xs uppercase font-semibold">Confidence</p>
                            <p class="text-lg font-display text-emerald-400">98.2%</p>
                        </div>
                    </div>
                </div>
            </section>

            <div class="flex items-center justify-between animate-entry animate-entry-delay-1 opacity-0">
                <div class="flex gap-2">
                    <button class="px-4 py-2 rounded-lg bg-zinc-800 text-white text-sm border border-zinc-700 hover:border-ai-glow transition-colors">
                        All Suggestions
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-transparent text-zinc-500 text-sm border border-transparent hover:bg-zinc-900 transition-colors">
                        Pending
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-zinc-600 text-xs"></i>
                    <input type="text" placeholder="Search insights..." class="pl-8 pr-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-sm text-white focus:outline-none focus:border-ai-glow focus:ring-1 focus:ring-ai-glow/50 w-64 transition-all">
                </div>
            </div>

            <div class="bg-zinc-900/50 backdrop-blur-md border border-zinc-800 rounded-2xl overflow-hidden shadow-xl animate-entry animate-entry-delay-2 opacity-0">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-xs uppercase text-zinc-500 tracking-wider">
                            <th class="p-4 font-medium">Status</th>
                            <th class="p-4 font-medium">Category</th>
                            <th class="p-4 font-medium w-1/3">AI Summary</th>
                            <th class="p-4 font-medium">Sentiment</th>
                            <th class="p-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="suggestions-grid" class="divide-y divide-zinc-800/50 text-sm">
                        <tr class="animate-pulse">
                            <td colspan="5" class="p-8 text-center text-zinc-600">Loading neural network...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
        </div>
    </main>

    <script>
        // 1. CONFIG & MOCK DATA
        const API_BASE_URL = "http://localhost:8000"; // Python Backend
        
        const MOCK_DATA = {
            suggestions: [
                { id: 101, status: 'pending', category: 'Facilities', text: "The wi-fi on the 3rd floor is absolutely terrible, I can't do video calls.", summary: "Network Infrastructure Critical", sentiment: 15, date: "2m ago" },
                { id: 102, status: 'approved', category: 'HR', text: "We should really have a hybrid work policy that is clearer.", summary: "Policy Clarification Request", sentiment: 65, date: "15m ago" },
                { id: 103, status: 'pending', category: 'Wellness', text: "Love the new coffee machine! It makes mornings so much better.", summary: "Positive Amenity Feedback", sentiment: 92, date: "1h ago" },
                { id: 104, status: 'rejected', category: 'Operations', text: "Why do we use Jira? It's too slow.", summary: "Tooling Friction detected", sentiment: 30, date: "2h ago" },
                { id: 105, status: 'pending', category: 'Facilities', text: "AC is broken in meeting room B again.", summary: "Maintenance Request: HVAC", sentiment: 20, date: "3h ago" },
                { id: 106, status: 'pending', category: 'Product', text: "The new feature deployment process is buttery smooth.", summary: "Workflow Efficiency Praise", sentiment: 88, date: "4h ago" },
            ],
            trends: {
                average_sentiment: 62,
                top_keyword: "Hybrid Work",
                urgent_count: 2
            }
        };

        // 2. SECURITY & UTILS
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                // In a real app, verify token validity
                console.warn("No token found. Redirecting...");
                window.location.href = 'index.html'; 
            }
        }

        async function safeFetch(endpoint) {
            try {
                // Add token to headers if it exists
                const token = localStorage.getItem('token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
                
                const response = await fetch(`${API_BASE_URL}${endpoint}`, { headers });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (e) {
                console.warn(`API Error (${endpoint}): Using Mock Data fallback.`);
                // Simulate network delay for realism
                await new Promise(r => setTimeout(r, 600)); 
                
                // Route mock data logic
                if (endpoint === '/suggestions') return MOCK_DATA.suggestions;
                if (endpoint === '/stats/trends') return MOCK_DATA.trends;
                return [];
            }
        }

        // 3. UI RENDERERS
        function getSentimentColor(score) {
            if (score >= 75) return 'bg-emerald-500';
            if (score >= 40) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function getStatusBadge(status) {
            const styles = {
                pending: 'bg-zinc-800 text-zinc-300 border-zinc-700',
                approved: 'bg-emerald-900/30 text-emerald-400 border-emerald-900/50',
                rejected: 'bg-red-900/30 text-red-400 border-red-900/50'
            };
            return `<span class="px-2 py-1 rounded-md text-[10px] uppercase font-bold tracking-wider border ${styles[status] || styles.pending}">${status}</span>`;
        }

        function renderGrid(items) {
            const tbody = document.getElementById('suggestions-grid');
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-zinc-800/30 transition-colors group';
                row.style.animationDelay = `${index * 50}ms`; // Staggered entry
                
                row.innerHTML = `
                    <td class="p-4 align-middle">${getStatusBadge(item.status)}</td>
                    <td class="p-4 align-middle">
                        <span class="text-zinc-400 font-mono text-xs bg-zinc-900 px-2 py-1 rounded">${item.category}</span>
                    </td>
                    <td class="p-4 align-middle relative tooltip-trigger cursor-help">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-robot text-ai-glow text-xs"></i>
                            <span class="text-zinc-200 font-medium">${item.summary}</span>
                        </div>
                        <div class="tooltip-content invisible opacity-0 absolute bottom-full left-0 mb-2 w-64 p-3 bg-zinc-950 border border-zinc-800 rounded-lg shadow-2xl transition-all duration-200 z-50 pointer-events-none">
                            <p class="text-[10px] text-zinc-500 uppercase mb-1">Original Text</p>
                            <p class="text-zinc-300 text-xs italic">"${item.text}"</p>
                            <div class="absolute bottom-[-5px] left-4 w-2 h-2 bg-zinc-950 border-r border-b border-zinc-800 rotate-45"></div>
                        </div>
                    </td>
                    <td class="p-4 align-middle">
                        <div class="w-full max-w-[120px]">
                            <div class="flex justify-between text-[10px] text-zinc-500 mb-1">
                                <span>Score</span>
                                <span>${item.sentiment}/100</span>
                            </div>
                            <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                                <div class="h-full ${getSentimentColor(item.sentiment)} rounded-full" style="width: ${item.sentiment}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 align-middle text-right">
                        <button class="hover-spring w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-800 text-emerald-500 hover:border-emerald-500/50 hover:bg-emerald-900/20 mr-1" title="Approve">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button class="hover-spring w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-800 text-red-500 hover:border-red-500/50 hover:bg-red-900/20" title="Reject">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function calculateStatsInternal(items) {
            // If API fails, we calculate stats from the list we have (Mock or fetched list)
            if (items.length === 0) return { average_sentiment: 0, top_keyword: 'N/A', urgent_count: 0 };
            
            const totalSent = items.reduce((acc, curr) => acc + curr.sentiment, 0);
            const urgent = items.filter(i => i.sentiment < 40).length;
            
            return {
                average_sentiment: Math.round(totalSent / items.length),
                top_keyword: "Hybrid Work", // Simplified for demo
                urgent_count: urgent
            };
        }

        function updateHeader(stats) {
            const scoreEl = document.getElementById('stat-score');
            const topicEl = document.getElementById('stat-topic');
            const urgentEl = document.getElementById('stat-urgent');
            const headerText = document.getElementById('header-sentiment-text');

            // Animate Numbers
            scoreEl.innerText = `${stats.average_sentiment}%`;
            topicEl.innerText = stats.top_keyword;
            urgentEl.innerText = stats.urgent_count;

            if (stats.average_sentiment > 70) {
                headerText.innerText = "Overwhelmingly Positive";
                headerText.className = "text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400";
            } else if (stats.average_sentiment > 40) {
                headerText.innerText = "Cautiously Optimistic";
                headerText.className = "text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-400";
            } else {
                headerText.innerText = "Critical Attention Needed";
                headerText.className = "text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-pink-500";
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        // 4. INIT
        async function init() {
            checkAuth();

            // Fetch Suggestions
            const suggestions = await safeFetch('/suggestions');
            renderGrid(suggestions);

            // Fetch Stats (or calculate if endpoint fails but list exists)
            let stats;
            try {
                // Try fetch specifically for stats
                const response = await fetch(`${API_BASE_URL}/stats/trends`);
                if (!response.ok) throw new Error();
                stats = await response.json();
            } catch (e) {
                // If specific stats endpoint fails, calculate from the suggestions we loaded
                stats = calculateStatsInternal(suggestions);
            }
            updateHeader(stats);
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
