<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | User Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        zinc: { 950: '#09090b', 900: '#18181b', 850: '#27272a' },
                        neon: { cyan: '#22d3ee', purple: '#a855f7' }
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge-pending { @apply bg-yellow-500/10 text-yellow-500 border-yellow-500/20; }
        .status-badge-approved { @apply bg-emerald-500/10 text-emerald-500 border-emerald-500/20; }
        .status-badge-rejected { @apply bg-red-500/10 text-red-500 border-red-500/20; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry { animation: slideUp 0.6s ease-out forwards; }
        
        /* Custom scrollbar for better aesthetics */
        .no-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .no-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .no-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans h-screen flex overflow-hidden selection:bg-neon-cyan selection:text-black">

    <nav class="w-16 md:w-20 lg:w-64 border-r border-zinc-800 bg-zinc-900/50 backdrop-blur-xl flex flex-col justify-between py-6 z-20 transition-all duration-300 shrink-0">
        
        <div class="px-2 md:px-6 mb-8 flex items-center justify-center lg:justify-start gap-3">
            <div class="w-10 h-10 min-w-[2.5rem] rounded-lg bg-gradient-to-br from-neon-cyan to-neon-purple flex items-center justify-center text-black font-bold text-xl shadow-lg shadow-neon-cyan/20">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <span class="hidden lg:block font-display font-bold text-white text-xl tracking-tight">Nexus</span>
        </div>

        <div class="flex-1 px-2 md:px-4 space-y-2">
            <button class="w-full flex items-center justify-center lg:justify-start gap-3 px-0 lg:px-4 py-3 rounded-xl bg-zinc-800/80 text-white border border-zinc-700 shadow-lg relative group">
                <i class="fa-solid fa-grid-2 text-neon-cyan text-lg"></i>
                <span class="hidden lg:block font-medium text-sm">Dashboard</span>
                <span class="lg:hidden absolute left-14 bg-zinc-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 whitespace-nowrap border border-zinc-700">Dashboard</span>
            </button>

            <a href="submit.html" class="w-full flex items-center justify-center lg:justify-start gap-3 px-0 lg:px-4 py-3 rounded-xl text-zinc-500 hover:text-white hover:bg-zinc-900 transition-all group relative">
                <i class="fa-solid fa-plus text-lg group-hover:text-neon-purple transition-colors"></i>
                <span class="hidden lg:block font-medium text-sm">New Request</span>
                <span class="lg:hidden absolute left-14 bg-zinc-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 whitespace-nowrap border border-zinc-700">New Request</span>
            </a>

            <a href="profile.html" class="w-full flex items-center justify-center lg:justify-start gap-3 px-0 lg:px-4 py-3 rounded-xl text-zinc-500 hover:text-white hover:bg-zinc-900 transition-all group relative">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="hidden lg:block font-medium text-sm">Profile</span>
                 <span class="lg:hidden absolute left-14 bg-zinc-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 whitespace-nowrap border border-zinc-700">Profile</span>
            </a>
        </div>

        <div class="px-2 md:px-4">
             <button onclick="logout()" class="w-full flex items-center justify-center lg:justify-start gap-3 px-0 lg:px-4 py-3 rounded-xl text-zinc-500 hover:text-red-400 hover:bg-red-950/30 transition-all border border-transparent hover:border-red-900/50 group relative">
                <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                <span class="hidden lg:block font-medium text-sm">Logout</span>
                <span class="lg:hidden absolute left-14 bg-zinc-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 whitespace-nowrap border border-zinc-700">Logout</span>
            </button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <div class="absolute top-0 left-0 w-full h-96 bg-neon-purple/5 blur-[100px] pointer-events-none"></div>

        <header class="h-16 md:h-20 border-b border-zinc-800 flex items-center justify-between px-4 md:px-8 bg-zinc-900/30 backdrop-blur-sm z-10 shrink-0">
            <div>
                <h1 class="font-display font-bold text-white text-xl md:text-2xl truncate max-w-[200px] md:max-w-none" id="welcome-msg">My Dashboard</h1>
                <p class="text-[10px] md:text-xs text-zinc-500 mt-0.5 md:mt-1">Real-time status of your contributions.</p>
            </div>
            <a href="submit.html" class="bg-white text-black px-3 md:px-5 py-2 md:py-2.5 rounded-xl font-bold text-xs md:text-sm shadow-lg shadow-white/10 flex items-center gap-2 hover:bg-gray-200 transition-colors whitespace-nowrap">
                <i class="fa-solid fa-plus"></i> 
                <span class="hidden sm:inline">New Idea</span>
            </a>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-6 md:mb-8 animate-entry">
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 md:h-32">
                    <div class="text-zinc-500 text-xs font-bold uppercase tracking-wider">Total Requests</div>
                    <div class="text-3xl md:text-4xl font-display text-white" id="stat-total">--</div>
                    <div class="w-full bg-zinc-800 h-1 rounded-full overflow-hidden">
                        <div class="bg-white h-full" style="width: 10%"></div>
                    </div>
                </div>
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 md:h-32">
                    <div class="text-zinc-500 text-xs font-bold uppercase tracking-wider">Approved</div>
                    <div class="text-3xl md:text-4xl font-display text-emerald-400" id="stat-approved">--</div>
                    <div class="w-full bg-zinc-800 h-1 rounded-full overflow-hidden">
                        <div class="bg-emerald-500 h-full" style="width: 0%" id="bar-approved"></div>
                    </div>
                </div>
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 md:h-32">
                    <div class="text-zinc-500 text-xs font-bold uppercase tracking-wider">Avg Sentiment</div>
                    <div class="text-3xl md:text-4xl font-display text-neon-cyan" id="stat-impact">--%</div>
                    <div class="flex items-center gap-2 text-xs text-neon-cyan">
                        <i class="fa-solid fa-robot"></i>
                        <span>AI Analyzed</span>
                    </div>
                </div>
            </div>

            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6 pb-20">
                </div>

            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 animate-entry text-center">
                <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-4 text-zinc-600 text-2xl">
                    <i class="fa-regular fa-lightbulb"></i>
                </div>
                <h3 class="text-white font-display font-bold text-lg">No suggestions yet</h3>
                <p class="text-zinc-500 text-sm max-w-xs mt-2">Submit your first idea to see AI analysis here.</p>
                <a href="submit.html" class="mt-6 text-neon-cyan hover:text-white text-sm font-medium transition-colors">Start Writing &rarr;</a>
            </div>

        </div>
    </main>

    <script>
        // --- LOGIC START ---
        const API_BASE_URL = "http://localhost:8000"; 

        // 1. Check Auth
        const username = localStorage.getItem('username');
        const token = localStorage.getItem('token');
        
        if (!token || !username) {
            window.location.href = 'index.html';
        }

        document.getElementById('welcome-msg').innerText = `Hello, ${username}`;

        // 2. Fetch Data
        async function fetchData() {
            try {
                // Pass username as query param to filter on backend
                const response = await fetch(`${API_BASE_URL}/suggestions?username=${username}`);
                if (!response.ok) throw new Error("Failed to fetch");
                
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('card-grid').innerHTML = `<p class="text-red-500">Error connecting to server. Is Backend running?</p>`;
            }
        }

        // 3. Render
        function renderDashboard(items) {
            const grid = document.getElementById('card-grid');
            const emptyState = document.getElementById('empty-state');

            // A. Calculate Stats Dynamically
            const total = items.length;
            const approved = items.filter(i => i.status === 'approved').length;
            
            // Calculate Avg Sentiment (Impact Score)
            let totalSentiment = 0;
            items.forEach(i => totalSentiment += (i.sentiment || 0));
            const avgSentiment = total > 0 ? Math.round(totalSentiment / total) : 0;

            // Update DOM Stats
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-approved').innerText = approved;
            document.getElementById('stat-impact').innerText = avgSentiment + "%";
            
            // Update Progress Bar width
            const approvedPercent = total > 0 ? (approved / total) * 100 : 0;
            document.getElementById('bar-approved').style.width = `${approvedPercent}%`;

            // B. Handle Empty State
            if (total === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // C. Render Cards
            grid.innerHTML = items.map((item, index) => {
                const statusClass = item.status === 'approved' ? 'status-badge-approved' : 
                                    item.status === 'rejected' ? 'status-badge-rejected' : 'status-badge-pending';
                
                const icon = item.status === 'approved' ? 'fa-check' : 
                             item.status === 'rejected' ? 'fa-xmark' : 'fa-clock';

                return `
                <div class="glass-panel rounded-2xl p-6 relative group hover:scale-[1.02] transition-transform duration-300 opacity-0 animate-entry" style="animation-delay: ${index * 100}ms">
                    
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-mono uppercase tracking-widest text-zinc-500 border border-zinc-800 px-2 py-1 rounded-md bg-zinc-900/50">
                            ${item.category || 'General'}
                        </span>
                        <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border ${statusClass}">
                            <i class="fa-solid ${icon}"></i>
                            ${item.status}
                        </span>
                    </div>

                    <h3 class="text-white font-display font-semibold text-lg leading-snug mb-2 group-hover:text-neon-cyan transition-colors">
                        ${item.ai_summary || 'No Summary'}
                    </h3>
                    <p class="text-zinc-500 text-sm line-clamp-2 mb-4">
                        "${item.text || ''}"
                    </p>

                    <div class="pt-4 border-t border-white/5 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-neon-purple text-xs shadow-lg shadow-neon-purple/20">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-[10px] text-zinc-500 uppercase font-bold">AI Analysis</p>
                            <p class="text-xs text-zinc-300 truncate">${item.ai_note || 'Processed'}</p>
                        </div>
                        <div class="text-xs font-mono text-zinc-600">${item.date || ''}</div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Init
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
