<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Suggestion | Hackton</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a' },
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' },
                        violet: { 500: '#8b5cf6' }
                    }
                }
            }
        }
    </script>

    <style>
        /* THE PHYSICS ENGINE */
        body {
            background-color: #0f172a; /* Slate 900 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(34, 211, 238, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
        }

        /* 1. The Spring Rule */
        .hover-spring {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }
        .hover-spring:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(34, 211, 238, 0.15), 0 10px 10px -5px rgba(34, 211, 238, 0.04);
        }

        /* 2. The Entry Rule */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: slideUp 0.6s ease-out forwards;
        }

        /* 3. Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #22d3ee; /* Cyan 400 */
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Loader */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #22d3ee;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500/30">

    <canvas id="confetti-canvas"></canvas>

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1]">
        <div class="absolute top-20 left-20 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-violet-500/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 border-b border-white/5 bg-slate-900/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3 cursor-pointer hover-spring" onclick="window.location.href='dashboard.html'">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-violet-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                        <i class="fa-solid fa-bolt text-white text-xl"></i>
                    </div>
                    <span class="font-display font-bold text-xl tracking-tight text-white">Hackton<span class="text-cyan-400">.io</span></span>
                </div>

                <div class="hidden md:flex items-center gap-8">
                    <button onclick="window.location.href='dashboard.html'" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Dashboard</button>
                    <button class="text-sm font-medium text-cyan-400 relative">
                        Submit Idea
                        <span class="absolute -bottom-6 left-0 w-full h-0.5 bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]"></span>
                    </button>
                    
                    <div class="flex items-center gap-3 pl-6 border-l border-white/10">
                        <div class="text-right hidden lg:block">
                            <div class="text-sm font-medium text-white" id="nav-username">Loading...</div>
                            <div class="text-xs text-slate-400">Employee</div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-slate-700 ring-2 ring-white/10 flex items-center justify-center overflow-hidden hover-spring cursor-pointer relative group">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full object-cover">
                            <div class="absolute top-12 right-0 w-48 bg-slate-800 border border-white/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right">
                                <div class="p-2">
                                    <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-white/5 rounded-lg transition-colors">
                                        <i class="fa-solid fa-power-off mr-2"></i> Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-12 px-4 relative flex items-center justify-center">
        
        <div class="w-full max-w-2xl animate-entry">
            
            <div class="text-center mb-10">
                <span class="inline-block py-1 px-3 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-bold tracking-wider uppercase mb-4">
                    New Submission
                </span>
                <h1 class="font-display text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">
                    Make Your Voice <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-500">Heard</span>
                </h1>
                <p class="text-slate-400 text-lg">Suggest an improvement or pitch a new idea.</p>
            </div>

            <div class="glass-panel rounded-2xl p-8 md:p-10 relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <form id="submissionForm" onsubmit="handleSubmit(event)">
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-300 mb-2">Category</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="process" class="peer sr-only" checked>
                                <div class="p-3 rounded-xl border border-white/10 bg-white/5 text-center transition-all peer-checked:bg-cyan-500/20 peer-checked:border-cyan-500/50 peer-checked:text-cyan-400 hover:bg-white/10">
                                    <i class="fa-solid fa-gears mb-2 block"></i>
                                    <span class="text-xs font-semibold">Process</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="wellness" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 bg-white/5 text-center transition-all peer-checked:bg-violet-500/20 peer-checked:border-violet-500/50 peer-checked:text-violet-400 hover:bg-white/10">
                                    <i class="fa-solid fa-heart-pulse mb-2 block"></i>
                                    <span class="text-xs font-semibold">Wellness</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="product" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 bg-white/5 text-center transition-all peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500/50 peer-checked:text-emerald-400 hover:bg-white/10">
                                    <i class="fa-solid fa-box-open mb-2 block"></i>
                                    <span class="text-xs font-semibold">Product</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="category" value="other" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 bg-white/5 text-center transition-all peer-checked:bg-pink-500/20 peer-checked:border-pink-500/50 peer-checked:text-pink-400 hover:bg-white/10">
                                    <i class="fa-solid fa-lightbulb mb-2 block"></i>
                                    <span class="text-xs font-semibold">Other</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="mb-6 relative">
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-sm font-medium text-slate-300">Your Suggestion</label>
                            <button type="button" onclick="polishText()" id="polishBtn" class="text-xs flex items-center gap-2 text-violet-400 hover:text-violet-300 transition-colors bg-violet-500/10 hover:bg-violet-500/20 px-3 py-1.5 rounded-lg border border-violet-500/20">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>AI Polish</span>
                            </button>
                        </div>
                        <textarea id="suggestionInput" rows="6" class="glass-input w-full rounded-xl p-4 text-base leading-relaxed placeholder-slate-600 resize-none" placeholder="Describe your idea in detail... e.g., 'We should implement a recycling program for electronics...'"></textarea>
                        
                        <div id="polishOverlay" class="absolute inset-0 top-8 bg-slate-900/80 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center hidden">
                            <div class="spinner border-violet-500 mb-3 w-8 h-8 border-4"></div>
                            <span class="text-violet-300 text-sm font-medium animate-pulse">Consulting the Neural Net...</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-8">
                        <button type="button" onclick="window.location.href='dashboard.html'" class="text-slate-400 hover:text-white text-sm font-medium px-4 py-2 transition-colors">
                            Cancel
                        </button>
                        <button type="submit" id="submitBtn" class="group hover-spring bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-semibold py-3 px-8 rounded-xl shadow-lg shadow-cyan-500/25 flex items-center gap-3 active:scale-95 transition-all">
                            <span>Submit Proposal</span>
                            <i class="fa-solid fa-paper-plane group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // --- 1. CONFIGURATION ---
        const API_BASE_URL = "https://your-render-app.onrender.com"; // CHANGE AFTER DEPLOYMENT
        
        // --- 2. MOCK DATA (The Safety Net) ---
        const MOCK_DATA = {
            '/ai/polish': { 
                polished_text: "Implementation of a comprehensive e-waste recycling initiative to optimize corporate sustainability metrics and reduce carbon footprint by 15% within Q3." 
            },
            '/suggestions': { 
                success: true, 
                message: "Suggestion logged successfully." 
            },
            '/user': {
                name: "Alex Dev",
                role: "Senior Engineer"
            }
        };

        // --- 3. UTILITIES ---
        async function safeFetch(endpoint, options = {}) {
            try {
                // Simulate network delay for realism
                await new Promise(r => setTimeout(r, 800));
                
                // Try fetching (commented out for demo stability, uncomment to enable real API)
                // const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                // if (!response.ok) throw new Error('API Error');
                // return await response.json();

                throw new Error("Force Mock"); // Remove this line to use real API
            } catch (e) {
                console.warn(`API Failed for ${endpoint}, using MOCK DATA.`);
                if (endpoint.includes('/polish')) return MOCK_DATA['/ai/polish'];
                if (endpoint.includes('/suggestions')) return MOCK_DATA['/suggestions'];
                return null;
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('hackton_token');
            // For Demo purposes, if no token, we set a dummy one to allow viewing
            if (!token) {
                // window.location.href = 'index.html'; // UNCOMMENT FOR PROD
                console.log("No token found. In Prod, this redirects.");
                localStorage.setItem('hackton_token', 'demo_token');
            }
            document.getElementById('nav-username').innerText = "Alex Dev";
        }

        // --- 4. INTERACTION LOGIC ---

        // AI Polish Feature
        async function polishText() {
            const input = document.getElementById('suggestionInput');
            const overlay = document.getElementById('polishOverlay');
            const originalText = input.value;

            if (!originalText.trim()) {
                input.classList.add('animate-pulse', 'border-red-500');
                setTimeout(() => input.classList.remove('animate-pulse', 'border-red-500'), 500);
                return;
            }

            // Show UI Loading State
            overlay.classList.remove('hidden');
            
            // Call API (or Mock)
            const data = await safeFetch('/ai/polish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: originalText })
            });

            // Update UI
            overlay.classList.add('hidden');
            if (data && data.polished_text) {
                input.value = ""; // clear first
                typeWriter(input, data.polished_text); // Fancy typing effect
            }
        }

        // Typewriter Effect for AI text
        function typeWriter(element, text, i = 0) {
            if (i < text.length) {
                element.value += text.charAt(i);
                setTimeout(() => typeWriter(element, text, i + 1), 20);
            }
        }

        // Handle Submit
        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner border-white"></div> Processing...`;

            // Call API
            const data = await safeFetch('/suggestions', {
                method: 'POST',
                body: new FormData(e.target)
            });

            if (data && data.success) {
                // Success State
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Submitted!`;
                btn.classList.remove('from-cyan-500', 'to-violet-600');
                btn.classList.add('bg-green-500');
                
                fireConfetti();
                
                // Redirect after celebration
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2500);
            } else {
                // Error State
                btn.disabled = false;
                btn.innerHTML = originalContent;
                alert("Something went wrong. Please try again.");
            }
        }

        function logout() {
            localStorage.removeItem('hackton_token');
            window.location.href = 'index.html';
        }

        // --- 5. CONFETTI ENGINE (Zero-Dependency) ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const particleCount = 150;
            const colors = ['#22d3ee', '#8b5cf6', '#ffffff', '#34d399'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: (Math.random() - 0.5) * 20,
                    dy: (Math.random() - 0.5) * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: Math.random() * 10,
                    tiltAngleIncr: Math.random() * 0.1 + 0.05
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncr;
                    p.y += (Math.cos(p.tiltAngle) + 1 + p.h / 2) / 2;
                    p.x += Math.sin(p.tiltAngle) * 2;
                    p.tilt = Math.sin(p.tiltAngle) * 15;

                    if (p.y > canvas.height) particles.splice(index, 1);

                    ctx.beginPath();
                    ctx.lineWidth = p.w;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.w / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.h / 2);
                    ctx.stroke();
                });

                if (particles.length > 0) requestAnimationFrame(draw);
            }
            draw();
        }

        // Init
        window.addEventListener('DOMContentLoaded', checkAuth);

    </script>
</body>
</html>
