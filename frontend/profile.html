<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Zero-Build</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate-900 */
            color: #e2e8f0;
            overflow: hidden;
        }

        h1, h2, h3, .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-sidebar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animations */
        .hover-spring {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .hover-spring:hover {
            transform: scale(1.02) translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(6, 182, 212, 0.15);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: slideUp 0.6s ease-out forwards;
        }

        /* Background Grid */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-screen w-full flex bg-grid relative">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <aside class="w-20 md:w-64 h-full glass-sidebar flex flex-col justify-between p-6 z-20 relative">
        <div>
            <div class="flex items-center gap-3 mb-10 text-cyan-400">
                <i class="fas fa-cube text-2xl"></i>
                <span class="text-xl font-bold tracking-wider hidden md:block text-white">ZERO</span>
            </div>

            <nav class="space-y-4">
                <a id="nav-home" href="#" class="flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                    <i class="fas fa-home text-lg w-6 text-center"></i>
                    <span class="hidden md:block font-medium">Home</span>
                </a>
                
                <a id="nav-submit" href="submit.html" class="flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all hidden">
                    <i class="fas fa-plus-circle text-lg w-6 text-center"></i>
                    <span class="hidden md:block font-medium">New Request</span>
                </a>

                <a href="#" class="flex items-center gap-4 p-3 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    <i class="fas fa-user text-lg w-6 text-center"></i>
                    <span class="hidden md:block font-bold">My Profile</span>
                </a>
            </nav>
        </div>

        <button onclick="handleLogout()" class="flex items-center gap-4 p-3 rounded-xl text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-all w-full">
            <i class="fas fa-sign-out-alt text-lg w-6 text-center"></i>
            <span class="hidden md:block font-medium">Log Out</span>
        </button>
    </aside>

    <main class="flex-1 flex items-center justify-center p-6 relative z-10">
        
        <div id="profile-card" class="glass-panel w-full max-w-md rounded-3xl p-8 flex flex-col items-center relative overflow-hidden animate-entry hidden">
            
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-400 via-violet-500 to-cyan-400"></div>
            <div class="absolute top-4 right-4">
                <span class="flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
            </div>

            <div class="relative mb-6 group">
                <div class="w-32 h-32 rounded-full bg-gradient-to-br from-slate-800 to-slate-900 border-4 border-white/10 flex items-center justify-center shadow-2xl relative z-10">
                    <span id="user-initials" class="text-4xl font-bold font-display text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400">
                        --
                    </span>
                </div>
                <div class="absolute inset-0 bg-cyan-400/20 rounded-full blur-xl group-hover:bg-cyan-400/30 transition-all duration-500"></div>
            </div>

            <h2 id="user-name" class="text-3xl font-bold text-white mb-1 tracking-tight text-center">Loading...</h2>
            <p id="user-role" class="text-cyan-400 text-sm font-semibold tracking-widest uppercase mb-8">...</p>

            <div class="w-full grid grid-cols-3 gap-4 mb-8">
                <div class="glass-panel rounded-2xl p-3 text-center hover-spring cursor-default">
                    <div class="text-xs text-slate-400 mb-1">LEVEL</div>
                    <div id="user-level" class="text-xl font-bold text-white">1</div>
                </div>
                <div class="glass-panel rounded-2xl p-3 text-center hover-spring cursor-default">
                    <div class="text-xs text-slate-400 mb-1">PROJECTS</div>
                    <div id="project-count" class="text-xl font-bold text-white">0</div>
                </div>
                <div class="glass-panel rounded-2xl p-3 text-center hover-spring cursor-default">
                    <div class="text-xs text-slate-400 mb-1">RANK</div>
                    <div class="text-xl font-bold text-white">Novice</div>
                </div>
            </div>

            <div class="w-full space-y-3 mb-8">
                <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                    <span class="text-slate-400 text-sm"><i class="fas fa-user-tag mr-2"></i>Username</span>
                    <span id="display-username" class="text-slate-200 text-sm font-mono">...</span>
                </div>
                <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                    <span class="text-slate-400 text-sm"><i class="fas fa-server mr-2"></i>Status</span>
                    <span class="text-emerald-400 text-sm font-mono">Active</span>
                </div>
            </div>

            <div class="mt-2 text-xs text-slate-500 text-center">
                User ID: <span id="uuid-display" class="font-mono">...</span>
            </div>

        </div>
    </main>

    <script>
        // --- 1. CONFIGURATION & AUTH CHECK ---
        const API_BASE_URL = "http://127.0.0.1:5000"; // Replace with your Flask URL
        
        // Immediate Auth Check
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const username = localStorage.getItem('username');

        if (!token || !username) {
            window.location.href = 'index.html';
        }

        // --- 2. DYNAMIC NAVIGATION LOGIC ---
        function setupNavigation() {
            const homeLink = document.getElementById('nav-home');
            const submitLink = document.getElementById('nav-submit');

            // If Admin -> Go to Admin Panel
            if (role === 'admin') {
                homeLink.href = 'admin.html';
                homeLink.innerHTML = `<i class="fas fa-chart-line text-lg w-6 text-center"></i><span class="hidden md:block font-medium">Command Center</span>`;
            } 
            // If User -> Go to Dashboard
            else {
                homeLink.href = 'dashboard.html';
                homeLink.innerHTML = `<i class="fas fa-home text-lg w-6 text-center"></i><span class="hidden md:block font-medium">Dashboard</span>`;
                // Show Submit link only for users
                submitLink.classList.remove('hidden');
            }
        }

        // --- 3. UI HELPER FUNCTIONS ---
        function getInitials(name) {
            if (!name) return "??";
            return name.substring(0, 2).toUpperCase();
        }

        function calculateLevel(count) {
            // Simple gamification: Level up every 5 posts
            return Math.floor(count / 5) + 1;
        }

        // --- 4. DATA FETCHING (Using the API Contract) ---
        async function fetchUserData() {
            try {
                // We use the suggestions endpoint to calculate user stats
                const response = await fetch(`${API_BASE_URL}/suggestions`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    handleLogout(); // Token expired
                    return;
                }

                const suggestions = await response.json();
                
                // FILTER: Although backend should filter for users, we double check
                // for Admins who might see everyone's data on this endpoint.
                // We only want stats for the CURRENT logged in user.
                const mySuggestions = suggestions.filter(s => 
                    // If API returns username in the object, match it. 
                    // If simple user view returns only own items, length is enough.
                    s.username ? s.username === username : true
                );

                const projectCount = mySuggestions.length;
                const level = calculateLevel(projectCount);

                // Update UI
                updateUI(projectCount, level);

            } catch (error) {
                console.error("Failed to fetch stats:", error);
                // Fallback to 0 if API fails, but keep UI intact
                updateUI(0, 1);
            }
        }

        function updateUI(count, level) {
            // Text Elements
            document.getElementById('user-name').innerText = username;
            document.getElementById('display-username').innerText = `@${username}`;
            document.getElementById('user-role').innerText = role;
            document.getElementById('user-initials').innerText = getInitials(username);
            
            // Stats
            document.getElementById('project-count').innerText = count;
            document.getElementById('user-level').innerText = level;

            // Fake UUID for tech feel
            document.getElementById('uuid-display').innerText = btoa(username + token).substring(0, 12);

            // Show Card
            document.getElementById('profile-card').classList.remove('hidden');
        }

        // --- 5. LOGOUT LOGIC ---
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setupNavigation();
            fetchUserData();
        });

    </script>
</body>
</html>
