<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralGate | Secure Access</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        zinc: { 950: '#09090b', 900: '#18181b', 850: '#27272a' },
                        ai: { glow: '#d946ef', dim: '#86198f' }, // Fuchsia-500
                        secondary: '#6366f1', // Indigo-500
                    },
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                        'reverse-spin': 'spin 15s linear infinite reverse',
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* GLASSMORPHISM */
        .glass-panel {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-input {
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #d946ef;
            box-shadow: 0 0 0 2px rgba(217, 70, 239, 0.2);
            outline: none;
        }

        /* NEBULA ANIMATION */
        @keyframes nebulaMove {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(20px, -20px) scale(1.1); opacity: 0.6; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
        }
        .nebula-blob {
            animation: nebulaMove 10s infinite alternate ease-in-out;
        }

        /* BUTTON HOVER */
        .hover-spring { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-spring:hover { transform: scale(1.02); }
        .hover-spring:active { transform: scale(0.98); }

        /* TOAST ANIMATION */
        #toast-container { transition: transform 0.3s ease, opacity 0.3s ease; }
        .toast-hidden { transform: translateY(20px); opacity: 0; pointer-events: none; }
        .toast-visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
        
        /* FORM TRANSITION */
        .form-content { transition: opacity 0.2s ease; }
        .opacity-0 { opacity: 0; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="nebula-blob absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-ai-glow/10 rounded-full blur-[100px]"></div>
        <div class="nebula-blob absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[100px]" style="animation-delay: -5s;"></div>
    </div>

    <main class="relative z-10 w-full max-w-4xl h-[600px] glass-panel rounded-3xl shadow-2xl flex overflow-hidden animate-fade-in">
        
        <div class="hidden md:flex w-1/2 bg-gradient-to-br from-zinc-900 to-black border-r border-white/5 flex-col items-center justify-center p-12 relative overflow-hidden group">
            
            <div class="relative w-48 h-48 flex items-center justify-center mb-8">
                <div class="absolute inset-0 bg-gradient-to-r from-ai-glow to-secondary rounded-full blur-3xl opacity-20 group-hover:opacity-30 transition duration-700"></div>
                <div class="relative z-10 text-6xl text-transparent bg-clip-text bg-gradient-to-br from-white to-gray-400 drop-shadow-[0_0_15px_rgba(217,70,239,0.3)]">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div class="absolute inset-0 border border-white/5 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-4 border border-white/5 rounded-full animate-reverse-spin"></div>
            </div>

            <div class="text-center z-10">
                <h1 class="font-display text-3xl font-bold tracking-tight mb-2">Neural<span class="text-ai-glow">Gate</span></h1>
                <p class="text-zinc-500 text-sm">Secure Access Intelligence</p>
            </div>
            
            <div class="absolute bottom-6 text-[10px] text-zinc-700 font-mono tracking-widest">
                SYSTEM_READY // V2.4.0
            </div>
        </div>

        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-zinc-900/30 backdrop-blur-sm relative">
            
            <div id="form-container" class="form-content">
                <div class="mb-10">
                    <h2 id="form-title" class="font-display text-2xl font-bold mb-2">Welcome Back</h2>
                    <p id="form-desc" class="text-zinc-400 text-sm">Enter your credentials to access the Neural Network.</p>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-6">
                    
                    <div class="group">
                        <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Identity</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 group-focus-within:text-ai-glow transition-colors"></i>
                            <input type="text" id="username" required 
                                class="glass-input w-full rounded-xl py-3.5 pl-11 pr-4 text-sm placeholder-zinc-600"
                                placeholder="username">
                        </div>
                    </div>

                    <div class="group">
                        <label class="block text-xs font-semibold text-zinc-500 mb-2 uppercase tracking-wider">Passcode</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 group-focus-within:text-ai-glow transition-colors"></i>
                            <input type="password" id="password" required 
                                class="glass-input w-full rounded-xl py-3.5 pl-11 pr-4 text-sm placeholder-zinc-600"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-ai-glow to-secondary py-3.5 rounded-xl text-white font-bold text-sm shadow-lg hover-spring relative overflow-hidden group mt-4">
                        <span id="btn-text" class="relative z-10 flex items-center justify-center gap-2">
                            Initialize Session <i class="fa-solid fa-arrow-right-to-bracket group-hover:translate-x-1 transition-transform"></i>
                        </span>
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-zinc-500 text-sm">
                        <span id="toggle-text">New to the network?</span>
                        <button onclick="toggleMode()" class="text-ai-glow hover:text-white font-semibold ml-1 transition-colors hover:underline">
                            <span id="toggle-action">Register Identity</span>
                        </button>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 toast-hidden">
        <div class="glass-panel bg-zinc-900 border-l-4 border-red-500 px-6 py-4 rounded-r-xl shadow-2xl flex items-center gap-4">
            <div class="bg-red-500/20 text-red-500 rounded-full w-8 h-8 flex items-center justify-center">
                <i class="fa-solid fa-triangle-exclamation text-sm"></i>
            </div>
            <div>
                <h4 class="text-white font-bold text-sm">Access Denied</h4>
                <p id="toast-message" class="text-zinc-400 text-xs">Invalid credentials provided.</p>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & MOCK DATA ---
        const API_BASE_URL = "http://localhost:8000"; // CHANGE ON DEPLOY
        
        const MOCK_DB = {
            users: [
                { username: "admin", password: "123", role: "admin", token: "mock-admin-token-777" },
                { username: "user", password: "123", role: "user", token: "mock-user-token-888" }
            ]
        };

        // State
        let isRegisterMode = false;

        // --- 2. CORE LOGIC ---

        // The "Uncrashable" Fetch Wrapper
        async function safeFetch(endpoint, options) {
            try {
                // Try Real API
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!response.ok && response.status !== 404) throw new Error("API Error");
                return await response.json();
            } catch (error) {
                console.warn(`⚠️ API Unreachable. Using Mock Data for ${endpoint}`);
                
                // Simulate Network Delay
                await new Promise(r => setTimeout(r, 800)); 

                // MOCK LOGIC
                const body = JSON.parse(options.body);

                if (endpoint === '/login') {
                    const user = MOCK_DB.users.find(u => u.username === body.username && u.password === body.password);
                    if (user) return user;
                    throw new Error("Invalid credentials");
                }

                if (endpoint === '/register') {
                    // In mock mode, we just say "Success" and log them in as a User
                    return { 
                        username: body.username, 
                        role: "user", 
                        token: "mock-new-user-token-" + Date.now() 
                    };
                }
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const originalBtnContent = btn.innerHTML;

            // 1. UI Loading State
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...`;
            btn.disabled = true;

            const endpoint = isRegisterMode ? '/register' : '/login';

            try {
                // 2. Call API (or Mock)
                const data = await safeFetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!data || !data.token) throw new Error("Auth Failed");

                // 3. Success: Save Session
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                
                // Determine Role logic
                let role = data.role;
                if (!role) {
                    role = data.username.toLowerCase().includes('admin') ? 'admin' : 'user';
                }
                localStorage.setItem('role', role);

                // 4. Redirect
                if (role === 'admin') window.location.href = 'admin.html';
                else window.location.href = 'dashboard.html';

            } catch (error) {
                console.error("Auth Error:", error);
                showToast(error.message || "Authentication failed");
                
                // Reset UI
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                document.getElementById('password').value = '';
            }
        }

        // --- 3. UI ANIMATIONS & TOGGLES ---

        function toggleMode() {
            const container = document.getElementById('form-container');
            
            // Fade Out
            container.classList.add('opacity-0');

            setTimeout(() => {
                isRegisterMode = !isRegisterMode;

                // Update Text
                if (isRegisterMode) {
                    document.getElementById('form-title').innerText = "Join the Network";
                    document.getElementById('form-desc').innerText = "Create a new secure identity.";
                    document.getElementById('btn-text').innerHTML = `Create Identity <i class="fa-solid fa-user-plus ml-2"></i>`;
                    document.getElementById('toggle-text').innerText = "Already have access?";
                    document.getElementById('toggle-action').innerText = "Login";
                } else {
                    document.getElementById('form-title').innerText = "Welcome Back";
                    document.getElementById('form-desc').innerText = "Enter your credentials to access the Neural Network.";
                    document.getElementById('btn-text').innerHTML = `Initialize Session <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>`;
                    document.getElementById('toggle-text').innerText = "New to the network?";
                    document.getElementById('toggle-action').innerText = "Register Identity";
                }

                // Fade In
                container.classList.remove('opacity-0');
            }, 200);
        }

        function showToast(msg) {
            const t = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = msg;
            
            t.classList.remove('toast-hidden');
            t.classList.add('toast-visible');
            setTimeout(() => {
                t.classList.remove('toast-visible');
                t.classList.add('toast-hidden');
            }, 3000);
        }

        // Auto-Redirect check
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            if(token && role) {
                if (role === 'admin') window.location.href = 'admin.html';
                else window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
